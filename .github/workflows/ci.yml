name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check dashboard JavaScript
        shell: pwsh
        run: node --check server/dashboard/app.js

      # Windows PowerShell 5.1 (not pwsh/PowerShell 7): this project's tests
      # touch System.Web.Extensions types that only resolve via the .NET
      # Framework GAC, which PowerShell 7's .NET Core runtime doesn't have -
      # pwsh reproducibly fails the Get-InstallServerMode tests with a
      # WebResourceAttribute load error unrelated to the code under test.
      # -SkipPublisherCheck/-Force are needed to replace Windows PowerShell
      # 5.1's own pre-installed Pester 3.4.0 (different signing cert) with
      # the modern version this suite requires.
      - name: Run PowerShell tests
        shell: powershell
        run: |
          Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -Force
          Invoke-Pester -Path .\tests\ -CI

      - name: Build server
        shell: pwsh
        run: |
          .\src\Build-Server.ps1
          .\build\WindowsInventoryLiteServer.exe --version

      - name: Build client
        shell: pwsh
        run: |
          .\src\Build-Client.ps1 -TargetFramework Net40 -OutputPath .\build\WindowsInventoryLiteClient-net40.exe
          .\build\WindowsInventoryLiteClient-net40.exe --version

      # The "Run PowerShell tests" step above also runs the C# self-tests
      # (via SelfTest.Tests.ps1/Pester), but against a server built into an
      # isolated $TestDrive path with no client exe beside it - two of those
      # self-tests need a real client exe next to the server-under-test exe
      # (GetExeVersion spawns the target file with --version; it doesn't
      # read a PE version resource, so nothing can fake this cheaply) and
      # silently skip their own real work there via their own File.Exists
      # guard. This step is the actual gate for those two tests: by now
      # build\ has the real server plus both real client targets (Build-
      # Server.ps1 builds net35/net40 as a side effect, and the step above
      # adds a second net40 build via the standalone Build-Client.ps1 path),
      # so --self-test here exercises what the isolated Pester run cannot.
      - name: Run self-tests against the real build
        shell: pwsh
        run: |
          .\build\WindowsInventoryLiteServer.exe --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "Server self-tests failed against the real build (exit code $LASTEXITCODE)"
          }

      # windows-latest GitHub-hosted runners ship with Go preinstalled - no
      # actions/setup-go step needed. This doesn't rebuild/recommit
      # linux-client/prebuilt/wil-linux-client (that stays a deliberate
      # human step, see the Pester staleness check above) - it only proves
      # the current Go source still builds, vets, and passes its own tests.
      - name: Build and test Linux client
        shell: pwsh
        working-directory: linux-client
        run: |
          go build ./...
          go vet ./...
          go test ./...
